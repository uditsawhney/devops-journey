# ---------------------------------------------------------------------------
# Ansible configuration for this project.
# Ansible auto-loads ansible.cfg from the current directory when you run
# ansible-playbook from here.
# ---------------------------------------------------------------------------

[defaults]
# Where to find our servers.
inventory = inventory.ini

# Don't prompt to confirm a new server's SSH fingerprint on first connect.
# Convenient for a learning lab. In a hardened production setup you would
# instead pre-populate known_hosts. This keeps automation from hanging.
host_key_checking = False

# Cleaner output.
stdout_callback = yaml

[ssh_connection]
# Speeds up repeated SSH connections to the same host.
pipelining = True
