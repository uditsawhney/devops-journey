# ---------------------------------------------------------------------------
# INVENTORY: the list of servers Ansible manages.
#
# Servers are organized into [groups]. Here we have one group: "appservers".
# A playbook can then target a whole group at once.
#
# ansible_host        -> the server's IP address
# ansible_user        -> the SSH user to log in as
# ansible_connection  -> "local" means "this same machine" (used when the
#                        control node configures ITSELF). When targeting a
#                        REMOTE server, remove ansible_connection and Ansible
#                        will SSH in as ansible_user@ansible_host.
# ---------------------------------------------------------------------------

[appservers]
# Because we're running Ansible ON the app server to configure itself,
# we use a local connection. No SSH needed for self-configuration.
app1 ansible_connection=local

# LATER, to manage a SECOND remote server, you'd add a line like:
# app2 ansible_host=172.99.75.99 ansible_user=ubuntu

[appservers:vars]
# Variables shared by all hosts in the group.
# These describe WHAT we want deployed, kept separate from the tasks so
# they're easy to change in one place.
repo_url=https://github.com/uditsawhney/devops-journey.git
app_dir=/home/ubuntu/src/devops-journey
image_name=devops-journey:latest
container_name=devops-journey-app
app_port=5000
