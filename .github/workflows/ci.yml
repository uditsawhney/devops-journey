# ---------------------------------------------------------------------------
# CI/CD pipeline for the DevOps Journey app.
#
# CI  (Continuous Integration): on every push/PR, test the code and build the
#     Docker image, so problems are caught early.
# CD  (Continuous Deployment): on pushes to main, if CI passes, automatically
#     deploy the new version to the Ubuntu server over SSH.
# ---------------------------------------------------------------------------

# The name shown in the GitHub "Actions" tab.
name: CI/CD

# WHEN should this workflow run? (the trigger)
on:
  push:
    branches: [ main ]        # run when code is pushed to main
  pull_request:
    branches: [ main ]        # also run on PRs targeting main (safety before merge)

# A workflow is made of one or more JOBS.
jobs:
  # -------------------------------------------------------------------------
  # JOB 1: test - install dependencies and run the automated tests.
  # -------------------------------------------------------------------------
  test:
    # The RUNNER: a fresh Ubuntu virtual machine provided free by GitHub.
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Check out (clone) our repository onto the runner.
      # "uses" pulls in a prebuilt Action maintained by GitHub.
      - name: Check out code
        uses: actions/checkout@v4

      # STEP 2: Install Python on the runner.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # STEP 3: Install our dependencies.
      # "run" executes shell commands directly on the runner.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 4: Run the automated tests. If pytest fails, the job fails (red X).
      - name: Run tests
        run: pytest -v

  # -------------------------------------------------------------------------
  # JOB 2: docker-build - make sure the Docker image still builds.
  # "needs: test" means this job only runs AFTER the test job passes.
  # No point building an image from code that fails its tests.
  # -------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Build the image exactly like we do on the server.
      # If the Dockerfile is broken, this step fails and flags the problem.
      - name: Build Docker image
        run: docker build -t devops-journey:ci .

  # -------------------------------------------------------------------------
  # JOB 3: deploy - ship the new version to the Ubuntu server over SSH.
  #
  # Guards that make this safe:
  #   needs: [test, docker-build]  -> only runs if BOTH earlier jobs passed
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #       -> only on a real push to main, NEVER on pull requests
  #          (we don't want an untrusted PR to deploy to our server)
  # -------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Open an SSH session to the server and run our deploy commands there.
      # appleboy/ssh-action is a widely used Action that handles the SSH
      # connection for us. Secrets are injected from GitHub Secrets and are
      # masked in logs (they never print as plain text).
      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # The script below runs ON the server. It pulls the latest code,
          # rebuilds the image, and restarts the container with the new version.
          script: |
            set -e
            cd ~/src/devops-journey
            echo "Pulling latest code..."
            git pull origin main
            echo "Rebuilding image..."
            docker build -t devops-journey:latest .
            echo "Restarting container..."
            docker rm -f devops-journey-app || true
            docker run -d -p 5000:5000 --name devops-journey-app --restart unless-stopped devops-journey:latest
            echo "Cleaning up old unused images..."
            docker image prune -f
            echo "Deploy complete."
